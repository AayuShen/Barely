# Barely - created by AayuShen.
# Pushing a tag like v1.1.0 builds, tests and publishes a GitHub Release with a zip and
# SHA-256 checksums. Release notes come from that version's section in CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches version.h
        shell: pwsh
        run: |
          $v = ([regex]::Match((Get-Content src/version.h -Raw), 'BARELY_VERSION_STR "([^"]+)"')).Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version.h ($v)" }

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Test
        shell: pwsh
        run: ./tests/run-tests.ps1

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "Barely-$tag-win-x64"
          New-Item -ItemType Directory dist, "dist/$name" | Out-Null
          Copy-Item build/barely.exe, build/barelyw.exe, build/barely_tap.dll, README.md, LICENSE, CHANGELOG.md, SECURITY.md "dist/$name"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          Remove-Item "dist/$name" -Recurse

          $files = @("dist/$name.zip", "build/barely.exe", "build/barelyw.exe", "build/barely_tap.dll")
          $sums = foreach ($f in $files) { "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $(Split-Path $f -Leaf)" }
          $sums | Set-Content -Encoding ascii dist/SHA256SUMS.txt

          $v = $tag.TrimStart("v")
          $changelog = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success) { throw "No CHANGELOG.md section for $v" }
          $notes = @(
            "**Barely $tag** - a transparent Windows 11 taskbar with no background process. Created by AayuShen.",
            "",
            $m.Groups[1].Value.Trim(),
            "",
            "## Install",
            "1. Download ``$name.zip`` and extract it to a folder you'll keep (for example ``E:\Tools\Barely``).",
            "2. Open a terminal in that folder and run ``.\barely.exe`` (or ``.\barely.exe --settings``).",
            "3. Optional: ``.\barely.exe --autostart on``.",
            "",
            "## Checksums (SHA-256)",
            '```',
            ($sums -join "`n"),
            '```'
          )
          $notes -join "`n" | Set-Content -Encoding utf8 dist/notes.md

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag (Get-ChildItem dist -Exclude notes.md).FullName --title "Barely $tag" --notes-file dist/notes.md --verify-tag
